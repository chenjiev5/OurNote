<h2>暖色系主题配色方案</h2>
<p class="subtitle">选择你喜欢的配色风格</p>

<div class="options">
  <div class="option" data-choice="warm-cream" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>温暖奶油色</h3>
      <p>主色 #F5E6D3 背景 + #D4A574 强调 + #8B4513 文字</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <div style="width:40px;height:40px;background:#F5E6D3;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#D4A574;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#8B4513;border-radius:8px"></div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="sunset" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>日落橙红</h3>
      <p>主色 #FFF5EB 背景 + #FF7F50 强调 + #2D1810 文字</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <div style="width:40px;height:40px;background:#FFF5EB;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#FF7F50;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#2D1810;border-radius:8px"></div>
      </div>
    </div>
  </div>

  <div class="option" data-choice="peach" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>蜜桃粉橙</h3>
      <p>主色 #FDF2F0 背景 + #FF9E80 强调 + #4A3728 文字</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <div style="width:40px;height:40px;background:#FDF2F0;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#FF9E80;border-radius:8px"></div>
        <div style="width:40px;height:40px;background:#4A3728;border-radius:8px"></div>
      </div>
    </div>
  </div>
</div>
