<h2>界面布局方案</h2>
<p class="subtitle">选择适合多设备使用的布局风格</p>

<div class="options">
  <div class="option" data-choice="tab" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Tab 导航</h3>
      <p>底部 Tab 导航（手机）/ 侧边栏（电脑）</p>
      <p style="margin-top:8px;font-size:12px;color:#666">记账本 | 记一笔 | 统计 | 我的</p>
    </div>
  </div>

  <div class="option" data-choice="single" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>单页+弹窗</h3>
      <p>单一页面，添加/编辑用弹窗完成</p>
      <p style="margin-top:8px;font-size:12px;color:#666">适合极简主义者</p>
    </div>
  </div>

  <div class="option" data-choice="wizard" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>向导流程</h3>
      <p>分步引导：选记账本 → 记花销 → 查看统计</p>
      <p style="margin-top:8px;font-size:12px;color:#666">适合新手入门</p>
    </div>
  </div>
</div>
