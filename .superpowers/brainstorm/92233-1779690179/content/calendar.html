<h2>日历视图设计</h2>
<p class="subtitle">日历上直接展示每日花销汇总</p>

<div class="split">

      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:#666">

      </div>

        <div style="font-size:24px;font-weight:bold;color:#8B4513">¥2,456</div>
      </div>
    </div>
  </div>

        <div style="height:64px;background:#FAFAFA;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>8</span></div>
        <div style="height:64px;background:#FAFAFA;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>9</span></div>
        <div style="height:64px;background:#FAFAFA;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>10</span></div>
        <div style="height:64px;background:#FAFAFA;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>11</span></div>
        <div style="height:64px;background:#FAFAFA;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span>12</span></div>

        <div style="flex:1;padding:16px;background:#D4A574;border-radius:8px;text-align:center">
          <div style="font-size:12px;color:#FFF">本月支出</div>
          <div style="font-size:28px;font-weight:bold;color:#FFF">¥2,456</div>
